<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Steve Ross&rsquo;s Palm Beach County Portfolio | The Real Deal</title>
    <meta name="description" content="An interactive map of 28 properties tied to Steve Ross&rsquo;s Related Ross across West Palm Beach, Boca Raton and Wellington, from CityPlace to the Boca Raton Innovation Campus." />

    <!-- Pre-paint boot snippet (core/boot-snippet.html) with this map's key. -->
    <script>
      (function () {
        var r = document.documentElement, p = null;
        try { p = new URLSearchParams(location.search); } catch (e) {}
        var framed;
        try { framed = window.self !== window.top; } catch (e) { framed = true; }
        if ((p && p.get("layout") === "embed") || framed) r.setAttribute("data-layout", "embed");
        var q = p && p.get("theme"), saved = null;
        if (r.getAttribute("data-layout") !== "embed") {
          try { saved = localStorage.getItem("related-ross-projects-10-21-26:theme"); } catch (e) {}
        }
        var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        r.setAttribute("data-theme", (q === "dark" || q === "light") ? q
          : (saved === "dark" || saved === "light") ? saved : (dark ? "dark" : "light"));
      })();
    </script>

    <link href="https://api.mapbox.com/mapbox-gl-js/v3.5.1/mapbox-gl.css" rel="stylesheet" />
    <link href="https://static.therealdeal.com/ProximaNovaFontFamily/ProximaNova/proxima-nova-all.css" rel="stylesheet" />
    <link rel="stylesheet" href="trd-embed.css" />
    <link rel="stylesheet" href="trd-map.css" />
    <style>
      :root { --trd-embed-h: 690px; --trd-embed-h-phone: 730px; --trd-embed-h-wide: 670px; }
      html, body { height: 100%; }
      /* Headline block on top (shown in the embed too), map fills the rest. */
      body { display: flex; flex-direction: column; }
      .map-head {
        flex: 0 0 auto; padding: 14px 18px 12px;
        background: var(--trd-panel); border-bottom: 1px solid var(--trd-border);
      }
      .map-head h1 {
        font-family: var(--trd-font-serif); font-weight: 900; font-size: 24px;
        line-height: 1.15; letter-spacing: -0.01em; margin: 0;
      }
      .map-head p { margin: 4px 0 0; font-size: 15px; line-height: 1.35; color: var(--trd-muted); }
      @media (max-width: 560px) {
        .map-head { padding: 12px 14px 10px; }
        .map-head h1 { font-size: 21px; }
        .map-head p { font-size: 14px; }
      }
      .stage { position: relative; width: 100%; flex: 1 1 auto; min-height: 0; }
      /* Override the toolkit's fixed embed height: the stage takes what the headline leaves. */
      :root[data-layout="embed"] .stage.trd-embed-fill { height: auto; }
      .theme-toggle {
        position: absolute; top: 12px; right: 56px; z-index: 4;
        background: var(--trd-panel); color: var(--trd-text);
        border: 1px solid var(--trd-border); border-radius: 999px; cursor: pointer;
        padding: 6px 12px; font-size: 12px; font-weight: 700;
      }

      /* Filter bar (top-left) */
      .filters {
        position: absolute; top: 12px; left: 12px; z-index: 3;
        display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
        background: var(--trd-panel); color: var(--trd-text);
        border: 1px solid var(--trd-border); border-radius: 6px;
        padding: 10px 14px; font-size: 15px; box-shadow: var(--trd-shadow);
        max-width: calc(100% - 24px);
      }
      :root:not([data-layout="embed"]) .filters { max-width: calc(100% - 150px); }
      :root[data-layout="embed"] .filters { max-width: calc(100% - 66px); }   /* clear the top-right zoom control */
      .filters .count { color: var(--trd-muted); white-space: nowrap; }
      .filters .count b { color: var(--trd-text); }
      .link {
        font: inherit; font-weight: 700; color: var(--trd-brand);
        background: none; border: 0; cursor: pointer; padding: 0 2px;
      }
      .link[hidden] { display: none; }
      .zoom { color: var(--trd-muted); }

      /* Legend (bottom-left) */
      .legend {
        position: absolute; bottom: 28px; left: 12px; z-index: 3;
        background: var(--trd-panel); color: var(--trd-text);
        border: 1px solid var(--trd-border); border-radius: 6px;
        padding: 9px 11px; font-size: 12px; box-shadow: var(--trd-shadow);
        max-height: 60%; overflow: auto; max-width: 250px;
      }
      .legend .title { font-weight: 700; margin-bottom: 2px; }
      .legend .sub { color: var(--trd-muted); font-size: 11px; margin-bottom: 6px; }
      .legend .row {
        display: flex; align-items: center; gap: 8px; margin: 4px 0; cursor: pointer;
        opacity: 1; transition: opacity .15s;
      }
      .legend .row.dim { opacity: .35; }
      .legend .dot { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid #fff; flex: 0 0 auto; box-shadow: 0 0 0 1px rgba(0,0,0,.25); }
      .legend .lbl { flex: 1 1 auto; }
      .legend .n { color: var(--trd-muted); margin-left: auto; padding-left: 10px; white-space: nowrap; text-align: right; }
      .legend .n b { color: var(--trd-text); font-weight: 700; }
      .legend .note { color: var(--trd-muted); margin-top: 7px; padding-top: 6px; border-top: 1px solid var(--trd-border); font-size: 11px; line-height: 1.35; }
      @media (max-width: 560px) {
        .legend { max-height: 42%; padding: 7px 9px; font-size: 11px; max-width: 200px; bottom: 24px; }
        .legend .note, .legend .sub { display: none; }
        .filters { gap: 6px 10px; padding: 8px 10px; font-size: 13px; }
        /* The legend spans most of a phone's width; get it out of an open popup's way. */
        .stage.popup-open .legend { display: none; }
      }

      /* trd-map.js parks the embed zoom control top-left, under the filter bar;
         embeds have no theme toggle, so move it to the free top-right corner. */
      :root[data-layout="embed"] .mapboxgl-ctrl-top-left { left: auto; right: 0; }

      /* Popup — sits above the filter bar / legend overlays. */
      .mapboxgl-popup { z-index: 5; }
      .mapboxgl-popup-content { max-height: none; }
      .trd-popup-body { overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
      .mapboxgl-popup-close-button { z-index: 1; }
      .trd-popup-body h3 { padding-right: 14px; }
      .trd-popup-tag { font-size: 12px; font-weight: 700; margin: 2px 0 6px; display: inline-flex; align-items: center; gap: 6px; }
      .trd-popup-tag .dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.25); }
      .trd-popup-facts { margin: 4px 0 0; padding: 0; font-size: 12px; line-height: 1.45; }
      .trd-popup-facts div { margin: 2px 0; }
      .trd-popup-facts b { font-weight: 700; }
      .trd-popup-desc { font-size: 13px; line-height: 1.45; margin: 8px 0 0; }
      .trd-popup-more { font-size: 12px; margin: 8px 0 0; }
      .trd-popup-more a { color: var(--trd-brand); font-weight: 700; text-decoration: none; }
      .trd-popup-more a:hover { text-decoration: underline; }
      .hover-tip .mapboxgl-popup-content { padding: 5px 9px; font-size: 12px; font-weight: 700; pointer-events: none; }
      .hover-tip .mapboxgl-popup-tip { display: none; }
    </style>
  </head>
  <body>
    <header class="map-head">
      <h1>Steve Ross&rsquo;s Palm Beach County Portfolio</h1>
      <p>Properties tied to Related Ross as of October 2026</p>
    </header>

    <!-- .trd-embed-fill makes .stage adopt the fixed embed height. -->
    <div class="trd-map stage trd-embed-fill">
      <div id="map"></div>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">Dark</button>

      <div class="filters" role="group" aria-label="Filters">
        <span class="count" id="count"></span>
        <span class="zoom">Zoom: <button class="link" data-zoom="downtown" type="button">Downtown West Palm</button> · <button class="link" data-zoom="West Palm Beach" type="button">West Palm</button> · <button class="link" data-zoom="Boca Raton" type="button">Boca Raton</button> · <button class="link" data-zoom="" type="button">All</button></span>
        <button class="link" id="reset" type="button" hidden>Show all types</button>
      </div>

      <div class="legend" aria-label="Legend">
        <div class="title">Property type</div>
        <div class="sub">Click a type to isolate it</div>
        <div id="legendRows"></div>
        <div class="note">Shaded areas are parcels from the Palm Beach County Property Appraiser. Property types assigned by The Real Deal.</div>
      </div>
    </div>

    <script src="https://api.mapbox.com/mapbox-gl-js/v3.5.1/mapbox-gl.js"></script>
    <script src="trd-embed.js"></script>
    <script src="trd-map.js"></script>
    <script>
      // Types assigned in build_data.py. Light/dark steps are the dataviz-skill
      // categorical slots used on the branded-condos map, plus a neutral for Other.
      var TYPE_ORDER = ["Office", "Residential", "Hotel", "Retail & mixed-use", "Other"];
      var PALETTES = {
        light: { "Office": "#2a78d6", "Residential": "#eb6834", "Hotel": "#4a3aa7", "Retail & mixed-use": "#1baf7a", "Other": "#7d838f" },
        dark:  { "Office": "#3987e5", "Residential": "#d95926", "Hotel": "#9085e9", "Retail & mixed-use": "#199e70", "Other": "#9aa0ab" },
      };
      // Downtown preset: CityPlace / Flagler Drive core (Clematis to Okeechobee).
      var DOWNTOWN = [[-80.0655, 26.7005], [-80.0485, 26.7165]];
      var MONTHS = ["Jan.", "Feb.", "March", "April", "May", "June", "July", "Aug.", "Sept.", "Oct.", "Nov.", "Dec."];
      // Public pk.* token — URL-restrict it in the Mapbox dashboard.
      var TOKEN = "pk.eyJ1IjoidHJkZGF0YSIsImEiOiJjamc2bTc2YmUxY2F3MnZxZGh2amR2MTY5In0.QlOWqB-yQNrNlXD0KQ9IvQ";

      var mapApi = null, GEO = null, PARCELS = null, popup = null, tip = null;
      var stage = document.querySelector(".stage");
      var currentTheme = document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
      var state = { type: "" };

      function palette() { return PALETTES[currentTheme] || PALETTES.light; }
      function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }
      function fact(lbl, value) {
        var v = String(value == null ? "" : value).trim();
        return v ? "<div><b>" + lbl + ":</b> " + v + "</div>" : "";
      }
      // "https://therealdeal.com/miami/2026/09/29/..." -> "Sept. 29, 2026"
      function storyDate(url) {
        var m = /\/(\d{4})\/(\d{2})\/(\d{2})\//.exec(url || "");
        return m ? MONTHS[+m[2] - 1] + " " + (+m[3]) + ", " + m[1] : "";
      }

      // ---- filtering --------------------------------------------------------
      function currentFilter() { return state.type ? ["==", ["get", "type"], state.type] : null; }
      function visible() { return GEO.features.filter(function (f) { return !state.type || f.properties.type === state.type; }); }
      // Camera padding that keeps dots clear of the filter bar (which wraps to
      // two or three lines on phones) as well as the map edges.
      function fitPad() {
        var narrow = document.getElementById("map").clientWidth < 560, base = narrow ? 24 : 50;
        var bar = document.querySelector(".filters");
        var top = bar ? bar.offsetTop + bar.offsetHeight + 12 : base;
        // On phones the legend spans most of the width, so reserve its height too.
        var leg = document.querySelector(".legend");
        var bottom = narrow && leg ? leg.offsetHeight + 36 : base;
        return { top: Math.max(base, top), bottom: bottom, left: base, right: base };
      }
      function fitTo(fs, maxZoom) {
        if (fs.length) mapApi.fitBounds(TRDMap.boundsOf(fs), { padding: fitPad(), maxZoom: maxZoom || 16 });
      }
      function applyFilter(refit) {
        if (!mapApi || !mapApi.map || !mapApi.map.getLayer("points")) return;
        ["points", "parcels-fill", "parcels-line"].forEach(function (id) { mapApi.map.setFilter(id, currentFilter()); });
        var vis = visible(), total = GEO.features.length;
        document.getElementById("count").innerHTML =
          "<b>" + (vis.length === total ? total : vis.length + " of " + total) + "</b> properties";
        document.getElementById("reset").hidden = !state.type;
        Array.prototype.forEach.call(document.querySelectorAll("#legendRows .row"), function (r) {
          r.classList.toggle("dim", !!state.type && r.getAttribute("data-type") !== state.type);
        });
        if (popup) popup.remove();
        if (refit) fitTo(vis, 15);
      }

      function buildControls() {
        var counts = {};
        GEO.features.forEach(function (f) { counts[f.properties.type] = (counts[f.properties.type] || 0) + 1; });
        var wrap = document.getElementById("legendRows");
        TYPE_ORDER.forEach(function (t) {
          if (!counts[t]) return;
          var row = document.createElement("div");
          row.className = "row"; row.setAttribute("data-type", t); row.setAttribute("role", "button"); row.tabIndex = 0;
          row.innerHTML = '<span class="dot"></span><span class="lbl">' + esc(t) + '</span><span class="n"><b>' + counts[t] + "</b></span>";
          function toggle() { state.type = state.type === t ? "" : t; applyFilter(true); }
          row.addEventListener("click", toggle);
          row.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });
          wrap.appendChild(row);
        });
        document.getElementById("reset").addEventListener("click", function () { state.type = ""; applyFilter(true); });
        Array.prototype.forEach.call(document.querySelectorAll("[data-zoom]"), function (b) {
          b.addEventListener("click", function () {
            var z = b.getAttribute("data-zoom");
            if (z === "downtown") return mapApi.fitBounds(DOWNTOWN, { padding: fitPad(), maxZoom: 17 });
            fitTo(visible().filter(function (f) { return !z || f.properties.area === z; }), 15);
          });
        });
        paintLegend();
      }
      function paintLegend() {
        var pal = palette();
        Array.prototype.forEach.call(document.querySelectorAll("#legendRows .row"), function (r) {
          r.querySelector(".dot").style.background = pal[r.getAttribute("data-type")];
        });
      }

      // ---- popup ------------------------------------------------------------
      function popupHTML(p, maxH) {
        var pal = palette(), d = storyDate(p.link);
        return '<div class="trd-popup-body" style="max-height:' + maxH + 'px">' +
          "<h3>" + esc(p.name) + "</h3>" +
          '<div class="trd-popup-tag"><span class="dot" style="background:' + pal[p.type] + '"></span>' + esc(p.type) + "</div>" +
          '<div class="trd-popup-facts">' +
            fact("Address", esc(p.address)) +
            fact("Last sale amount", esc(p.sale_amount)) +
            fact("Last sale date", esc(p.sale_date)) +
          "</div>" +
          (p.description ? '<p class="trd-popup-desc">' + esc(p.description) + "</p>" : "") +
          (p.link ? '<p class="trd-popup-more"><a href="' + esc(p.link) + '" target="_blank" rel="noopener">Previous reporting' + (d ? " (" + esc(d) + ")" : "") + " &rarr;</a></p>" : "") +
          "</div>";
      }
      function openFeature(feature) {
        var f = GEO.features[feature.properties.i];
        if (!f) return;
        var coords = f.geometry.coordinates.slice();
        if (tip) tip.remove();
        // Descriptions run long, so park the dot near the bottom and open the
        // popup upward, capped to the room between the dot and the filter bar.
        var H = document.getElementById("map").clientHeight;
        var dotY = H - 56;
        var maxH = Math.max(160, dotY - 12 - 10 - fitPad().top - 28);
        mapApi.flyTo(coords, { zoom: Math.max(mapApi.map.getZoom(), 16), offset: [0, dotY - H / 2] });
        if (popup) popup.remove();
        var mine = new mapboxgl.Popup({ offset: 12, anchor: "bottom", closeButton: true, maxWidth: "330px" })
          .setLngLat(coords)
          .setHTML(popupHTML(f.properties, maxH))
          .addTo(mapApi.map);
        popup = mine;
        stage.classList.add("popup-open");
        mine.on("close", function () { if (popup === mine) { popup = null; stage.classList.remove("popup-open"); } });
      }
      // Desktop hover: name tooltip (skipped while a click popup is open).
      function wireHover(map) {
        if (!window.matchMedia || !window.matchMedia("(hover: hover)").matches) return;
        tip = new mapboxgl.Popup({ closeButton: false, closeOnClick: false, offset: 10, className: "hover-tip" });
        ["points", "parcels-fill"].forEach(function (layer) {
          map.on("mousemove", layer, function (e) {
            var f = e.features && e.features[0];
            if (!f || popup) { tip.remove(); return; }
            tip.setLngLat(e.lngLat).setText(GEO.features[f.properties.i].properties.name).addTo(map);
          });
          map.on("mouseleave", layer, function () { tip.remove(); });
        });
      }

      var controller = TRDEmbed({
        prefix: "related-ross-projects-10-21-26",
        themeKey: "related-ross-projects-10-21-26:theme",
        toggle: "#themeToggle",
        mountTarget: "#map",
        onMount: function (ctx) {
          currentTheme = ctx.theme;
          Promise.all([TRDMap.loadGeoJSON("data.geojson"), TRDMap.loadGeoJSON("parcels.geojson")]).then(function (res) {
            GEO = res[0]; PARCELS = res[1];
            buildControls();
            mapApi = TRDMap.create({
              container: "map",
              token: TOKEN,
              theme: ctx.theme,
              embed: ctx.isEmbed,
              data: GEO,
              bounds: TRDMap.boundsOf(GEO),
              fitBoundsOptions: { padding: fitPad(), maxZoom: 12 },
              cooperativeGestures: ctx.isEmbed,
              interactiveLayers: ["points", "parcels-fill"],
              // Idempotent: re-runs on every style.load (incl. theme swaps).
              addLayers: function (map, c) {
                if (!map.getSource("parcels")) map.addSource("parcels", { type: "geojson", data: PARCELS });
                if (!map.getSource("pts")) map.addSource("pts", { type: "geojson", data: c.data });
                var color = c.matchColor(["get", "type"], palette());
                if (!map.getLayer("parcels-fill")) {
                  map.addLayer({
                    id: "parcels-fill", type: "fill", source: "parcels",
                    paint: { "fill-color": color, "fill-opacity": ["interpolate", ["linear"], ["zoom"], 12, 0.15, 16, 0.3] },
                  });
                  map.addLayer({
                    id: "parcels-line", type: "line", source: "parcels",
                    paint: { "line-color": color, "line-width": ["interpolate", ["linear"], ["zoom"], 12, 0.5, 16, 1.5] },
                  });
                  map.addLayer({
                    id: "points", type: "circle", source: "pts",
                    paint: {
                      "circle-radius": ["interpolate", ["linear"], ["zoom"], 9, 5, 13, 6.5, 16, 7.5],
                      "circle-color": color,
                      "circle-stroke-color": "#ffffff",
                      "circle-stroke-width": 1.5,
                      "circle-opacity": 0.92,
                    },
                  });
                } else {
                  ["parcels-fill", "parcels-line", "points"].forEach(function (id) {
                    map.setPaintProperty(id, id === "parcels-fill" ? "fill-color" : id === "parcels-line" ? "line-color" : "circle-color", color);
                  });
                }
                var f = currentFilter();
                if (f) ["points", "parcels-fill", "parcels-line"].forEach(function (id) { map.setFilter(id, f); });
              },
              // Clicks fire once per layer; a dot wins over whatever parcel lies under it.
              onFeatureClick: function (feature, e) {
                if (!feature) return;
                if (feature.layer.id !== "points" && e && mapApi.map.queryRenderedFeatures(e.point, { layers: ["points"] }).length) return;
                openFeature(feature);
              },
            });
            mapApi.on("loaded", function () {
              wireHover(mapApi.map);
              applyFilter(false);
              // Refit once the iframe/stage has settled at its final height.
              mapApi.map.resize();
              fitTo(visible(), 12);
              ctx.postLoaded();
            });
          }).catch(function (e) {
            console.error("[related-ross-projects-10-21-26] Could not load map data", e);
          });
        },
        onTheme: function (theme, ctx) {
          currentTheme = theme;
          var tb = document.getElementById("themeToggle");
          if (tb) tb.textContent = theme === "dark" ? "Light" : "Dark";
          paintLegend();
          if (mapApi) mapApi.setTheme(theme);
          ctx.requestResize();
        },
      });
    </script>
  </body>
</html>

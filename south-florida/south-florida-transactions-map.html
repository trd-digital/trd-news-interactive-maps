<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>South Florida Live Transactions Map - The Real Deal</title>
    <link rel="icon" type="image/x-icon" href="https://therealdeal.com/favicon.ico" />
    <link rel="canonical" href="https://therealdeal.com/data/miami/2024/priciest-south-florida-sales/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&display=swap" />
    <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/v3.5.1/mapbox-gl.css" />
    <link rel="stylesheet" href="transactions/tx.css?v=11" />

    <!-- Google Tag Manager -->
    <script>
      (function (w, d, s, l, i) {
        w[l] = w[l] || [];
        w[l].push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
        var f = d.getElementsByTagName(s)[0],
          j = d.createElement(s),
          dl = l != "dataLayer" ? "&l=" + l : "";
        j.async = true;
        j.src = "https://www.googletagmanager.com/gtm.js?id=" + i + dl;
        f.parentNode.insertBefore(j, f);

  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript
      ><iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-K694XL6"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
      ></iframe
    ></noscript>
    <!-- End Google Tag Manager (noscript) -->

    <main id="tx-app" class="tx-map-app">
      <div class="tx-topbar">
        <button type="button" class="tx-filter-toggle" aria-expanded="false" aria-controls="tx-filter-panel">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 5h14M6 10h8M9 15h2" /></svg>
          <span class="tx-ft-label">Filters</span>
          <span class="tx-badge" hidden>0</span>
        </button>
        <div class="tx-count" aria-live="polite"></div>
        <div id="tx-filter-panel" class="tx-filter-panel" hidden></div>
        <ul id="tx-results" class="tx-results" aria-label="Search suggestions" hidden></ul>
      </div>
      <div class="tx-map-wrap">
        <div id="tx-map" role="region" aria-label="Map of recent South Florida sales"></div>
        <div class="tx-active" aria-label="Active filters" hidden></div>
        <button type="button" class="tx-area-btn" hidden>
          <svg aria-hidden="true" width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="8.5" cy="8.5" r="5.5" /><path d="M13 13l4.5 4.5" /></svg>
          Search this area
        </button>
        <div class="tx-legend"></div>
        <div class="tx-empty-map" hidden></div>
        <div id="tx-layers" class="tx-layers" role="dialog" aria-label="Map layers" hidden></div>
        <button type="button" class="tx-list-btn" hidden></button>
        <aside class="tx-sheet tx-detail" role="dialog" aria-label="Sales in view" hidden></aside>
        <aside class="tx-detail" role="dialog" aria-modal="false" hidden></aside>
        <div class="tx-loading"><span class="tx-spinner" aria-hidden="true"></span><span>Loading recent sales…</span></div>
      </div>
      <div class="tx-mapnote"></div>
    </main>

    <script src="https://experience.tinypass.com/xbuilder/experience/load?aid=p7sVIGTDn5"></script>
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.5.1/mapbox-gl.js"></script>
    <script src="https://static.therealdeal.com/library/theme.js?v=1.0"></script>
    <script src="transactions/tx-core.js?v=11"></script>
    <script src="transactions/tx-search.js?v=11"></script>
    <script src="transactions/tx-charts.js?v=11"></script>
    <script src="transactions/tx-compare.js?v=11"></script>
    <script src="transactions/tx-map.js?v=11"></script>
  </body>
</html>

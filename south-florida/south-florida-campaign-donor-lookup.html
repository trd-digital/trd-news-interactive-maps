<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Real Estate Donor Lookup - The Real Deal</title>
    <link rel="icon" type="image/x-icon" href="https://therealdeal.com/favicon.ico" />
    <link rel="preload" href="campaign/cf-realestate.json" as="fetch" crossorigin="anonymous" />

    <!-- Google Tag Manager (noscript) -->

        src="https://www.googletagmanager.com/ns.html?id=GTM-K694XL6"

    <!-- Donor lookup: campaign/cf-core.js + cf-lookup.js. Data: campaign/cf-realestate.json, built by
         _campaign/build_campaign.py from the Florida Division of Elections exports. -->
    <main id="tx-app" class="tx-table-app cx-app cf-app">
      <div class="cf-controls" role="search"></div>
      <div class="cf-donor-head cf-head" hidden></div>
      <div class="tx-toolbar">
        <div class="tx-tabs" role="tablist" aria-label="View">
          <button type="button" class="tx-tab" role="tab" data-tab="largest">Largest gifts</button>
          <button type="button" class="tx-tab" role="tab" data-tab="latest">Latest gifts</button>
        </div>
        <span class="tx-summary" aria-live="polite"></span>
      </div>
      <div style="position: relative; min-height: 200px">
        <div class="cf-host"></div>
        <div class="tx-loading"><span class="tx-spinner" aria-hidden="true"></span><span>Loading campaign contributions…</span></div>
      </div>
      <p class="tx-asof"></p>
    </main>

    <script src="https://static.therealdeal.com/library/theme.js?v=1.0"></script>
    <script src="campaign/cf-core.js?v=1"></script>
    <script src="campaign/cf-lookup.js?v=1"></script>

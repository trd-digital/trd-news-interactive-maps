<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Wynwood&rsquo;s New Projects and Retail Tenants | The Real Deal</title>
    <meta name="description" content="From the NoMad Residences to LIVWRK's three proposed 45-story towers, an interactive map of the condos, apartments, hotels and retail tenants reshaping Miami's Wynwood." />

    <!-- Pre-paint boot snippet (trd_graphics core/boot-snippet.html). -->
    <script>
      (function () {
        var r = document.documentElement, p = null;
        try { p = new URLSearchParams(location.search); } catch (e) {}
        var framed;
        try { framed = window.self !== window.top; } catch (e) { framed = true; }
        if ((p && p.get("layout") === "embed") || framed) r.setAttribute("data-layout", "embed");
        var q = p && p.get("theme"), saved = null;
        if (r.getAttribute("data-layout") !== "embed") {
          try { saved = localStorage.getItem("wynwood-map-09-25-26:theme"); } catch (e) {}
        }
        var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        r.setAttribute("data-theme", (q === "dark" || q === "light") ? q
          : (saved === "dark" || saved === "light") ? saved : (dark ? "dark" : "light"));
      })();
    </script>

    <link href="https://api.mapbox.com/mapbox-gl-js/v3.5.1/mapbox-gl.css" rel="stylesheet" />
    <link href="https://static.therealdeal.com/ProximaNovaFontFamily/ProximaNova/proxima-nova-all.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,700;0,900;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="trd-embed.css" />
    <link rel="stylesheet" href="trd-map.css" />
    <style>
      :root {
        --trd-embed-h: 680px;
        --trd-embed-h-phone: 680px;
        --trd-embed-h-wide: 600px;
        --story-w: 440px;
        /* Category colors (dataviz slots 1 + 3, validated on TRD surfaces). */
        --c-dev: #2a78d6;
        --c-retail: #eb6834;
      }
      :root[data-theme="dark"] { --c-dev: #3987e5; --c-retail: #d95926; }

      /* ---------- Hero (standalone only) ---------- */
      .hero { max-width: 820px; margin: 0 auto; padding: 54px 24px 26px; text-align: center; position: relative; }
      .hero h1 { font-family: var(--trd-font-serif); font-weight: 900; font-size: clamp(30px, 5vw, 46px); line-height: 1.06; letter-spacing: -0.015em; margin: 0 0 16px; }
      .hero-lede { font-size: 18px; line-height: 1.6; color: var(--trd-muted); margin: 0 auto; max-width: 640px; }
      .theme-toggle {
        position: absolute; top: 20px; right: 20px;
        display: inline-flex; align-items: center; gap: 7px;
        background: var(--trd-panel); color: var(--trd-text);
        border: 1px solid var(--trd-border); border-radius: 999px;
        padding: 7px 13px; font-size: 13px; font-weight: 700; cursor: pointer;
      }
      .theme-toggle:hover { background: var(--trd-bg-soft); }

      /* ---------- Layout ---------- */
      .layout { display: flex; align-items: flex-start; gap: 20px; max-width: 1240px; margin: 0 auto; padding: 8px 24px 60px; }
      .map-wrap {
        position: sticky; top: 16px; flex: 1 1 auto; min-width: 0;
        height: calc(100vh - 120px); min-height: 440px;
        border-radius: 12px; overflow: hidden; border: 1px solid var(--trd-border); box-shadow: var(--trd-shadow);
      }
      #map { position: absolute; inset: 0; }

      .story-wrap { flex: 0 0 var(--story-w); }
      .story { display: flex; flex-direction: column; gap: 14px; }

      /* ---------- Filter chips (double as the legend) ---------- */
      .filters {
        display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px;
        position: sticky; top: 0; z-index: 2; padding: 6px 0;
        background: var(--trd-bg);
      }
      .chip {
        display: inline-flex; align-items: center; gap: 7px;
        font: inherit; font-size: 13px; font-weight: 700; line-height: 1;
        padding: 7px 12px; border-radius: 999px; cursor: pointer;
        background: var(--trd-panel); color: var(--trd-text);
        border: 1px solid var(--trd-border);
      }
      .chip:hover { background: var(--trd-bg-soft); }
      .chip[aria-pressed="true"] { border-color: var(--trd-text); box-shadow: inset 0 0 0 1px var(--trd-text); }
      .chip .dot { width: 11px; height: 11px; border-radius: 50%; flex: 0 0 auto; }
      .chip .count { color: var(--trd-muted); font-weight: 600; }

      .step {
        --cat: var(--c-dev);
        background: var(--trd-panel); border: 1px solid var(--trd-border);
        border-left: 4px solid var(--trd-border); border-radius: 10px;
        padding: 16px 18px; cursor: pointer; scroll-margin-top: 58px;
        transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
      }
      .step.is-retail { --cat: var(--c-retail); }
      .step[hidden] { display: none; }
      .step:hover { transform: translateY(-1px); box-shadow: var(--trd-shadow); }
      .step.active {
        border-left-color: var(--cat);
        box-shadow: var(--trd-shadow);
        background: color-mix(in srgb, var(--cat) 7%, var(--trd-panel));
      }
      .step .kicker {
        display: flex; align-items: center; gap: 8px;
        font-size: 11px; font-weight: 800; letter-spacing: 0.09em; text-transform: uppercase;
        color: var(--trd-muted); margin: 0 0 8px;
      }
      .step .kicker .dot {
        width: 22px; height: 22px; border-radius: 50%; flex: 0 0 auto;
        display: inline-flex; align-items: center; justify-content: center;
        background: var(--cat); color: #fff; font-size: 11px; font-weight: 800; letter-spacing: 0;
      }
      .step .proj { font-family: var(--trd-font-serif); font-weight: 900; font-size: 19px; line-height: 1.18; margin: 0 0 8px; }
      .step .badge {
        display: inline-block; margin: 0 0 10px;
        font-size: 11px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase;
        padding: 3px 9px; border-radius: 999px;
        background: color-mix(in srgb, var(--badge-c) 14%, var(--trd-panel));
        color: var(--badge-c);
        border: 1px solid color-mix(in srgb, var(--badge-c) 40%, var(--trd-panel));
      }
      .step .badge.is-upcoming { --badge-c: #b05a00; }
      .step .badge.is-building { --badge-c: var(--trd-brand); }
      .step .badge.is-done { --badge-c: #1a7a3c; }
      :root[data-theme="dark"] .step .badge.is-upcoming { --badge-c: #e8a45c; }
      :root[data-theme="dark"] .step .badge.is-done { --badge-c: #63c98a; }
      .step .desc { font-size: 14px; line-height: 1.5; margin: 0 0 10px; }
      .step .facts { margin: 0; padding-top: 10px; border-top: 1px dashed var(--trd-border); display: grid; grid-template-columns: auto 1fr; gap: 5px 12px; }
      .step .facts dt { font-size: 11px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--trd-muted); padding-top: 1px; }
      .step .facts dd { margin: 0; font-size: 13px; line-height: 1.45; }

      /* ---------- Responsive (standalone) ---------- */
      @media (max-width: 900px) {
        .layout { flex-direction: column; padding: 8px 16px 48px; }
        .map-wrap { position: sticky; top: 0; height: 52vh; border-radius: 0; margin: 0 -16px; width: calc(100% + 32px); z-index: 3; }
        .story-wrap { flex: 1 1 auto; width: 100%; }
        .filters { position: static; }
        .hero { padding: 34px 18px 18px; }
      }

      /* =====================================================================
         EMBED MODE — fixed pixel heights only (no vh/svh). See toolkit README.
         ===================================================================== */
      :root[data-layout="embed"] .layout {
        position: relative; display: block; padding: 0; max-width: none; overflow: hidden;
      }
      :root[data-layout="embed"] .map-wrap {
        position: absolute; top: 0; left: 0; right: 0; bottom: auto;
        height: 300px; min-height: 0; border-radius: 0; border: none; box-shadow: none; margin: 0; width: auto;
      }
      :root[data-layout="embed"] .story-wrap {
        position: absolute; top: 300px; left: 0; right: 0; bottom: 0;
        width: auto; overflow-y: auto; -webkit-overflow-scrolling: touch;
        padding: 0 12px 12px; border-top: 1px solid var(--trd-border);
      }
      :root[data-layout="embed"] .filters { position: sticky; padding: 10px 0 8px; margin: 0 0 6px; background: var(--trd-bg); }
      @media (max-width: 560px) {
        :root[data-layout="embed"] .map-wrap { height: 260px; }
        :root[data-layout="embed"] .story-wrap { top: 260px; }
      }
      @media (min-width: 780px) {
        :root[data-layout="embed"] .map-wrap { position: absolute; inset: 0; height: var(--trd-embed-h-wide); }
        :root[data-layout="embed"] .story-wrap {
          position: absolute; top: 0; right: 0; bottom: 0; left: auto;
          width: 400px; padding: 0 14px 14px; overflow-y: auto;
          background: color-mix(in srgb, var(--trd-panel) 88%, transparent);
          backdrop-filter: blur(6px);
          border-top: none; border-left: 1px solid var(--trd-border);
        }
        :root[data-layout="embed"] .filters { background: color-mix(in srgb, var(--trd-panel) 96%, transparent); }
      }
    </style>
  </head>
  <body>
    <header class="hero trd-standalone-only">
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <span aria-hidden="true">☾</span><span>Dark</span>
      </button>
      <h1>Wynwood&rsquo;s New Projects and Retail Tenants</h1>
      <p class="hero-lede">
        Condo towers, apartment buildings, hotels and big-name retailers are reshaping
        Miami&rsquo;s arts district. Click a pin or a card to see what&rsquo;s planned,
        who&rsquo;s behind it and where it stands.
      </p>
    </header>

    <main class="layout trd-embed-fill">
      <section class="map-wrap trd-map" aria-label="Map of Wynwood developments and retail tenants">
        <div id="map" role="application" aria-label="Map"></div>
      </section>
      <section class="story-wrap" aria-label="Projects and tenants">
        <div class="filters" id="filters" role="group" aria-label="Filter by category">
          <button class="chip" type="button" data-cat="all" aria-pressed="true">All <span class="count" id="countAll"></span></button>
          <button class="chip" type="button" data-cat="dev" aria-pressed="false"><span class="dot" style="background:var(--c-dev)"></span>Developments <span class="count" id="countDev"></span></button>
          <button class="chip" type="button" data-cat="retail" aria-pressed="false"><span class="dot" style="background:var(--c-retail)"></span>Retail tenants <span class="count" id="countRetail"></span></button>
        </div>
        <div class="story" id="story" role="list"></div>
      </section>
    </main>

    <script src="https://api.mapbox.com/mapbox-gl-js/v3.5.1/mapbox-gl.js"></script>
    <script src="trd-embed.js"></script>
    <script src="trd-map.js"></script>
    <script>
      var TOKEN = "pk.eyJ1IjoidHJkZGF0YSIsImEiOiJjamc2bTc2YmUxY2F3MnZxZGh2amR2MTY5In0.QlOWqB-yQNrNlXD0KQ9IvQ";

      // Pin colors per category; must match --c-dev / --c-retail above.
      var COLORS = {
        light: { dev: "#2a78d6", retail: "#eb6834" },
        dark:  { dev: "#3987e5", retail: "#d95926" },
      };
      var EMPTY = { type: "FeatureCollection", features: [] };

      var mapApi = null, FEATURES = [], activeN = null, category = "all";
      var storyEl = document.getElementById("story");

      // Badge color follows the phase; the text is the sheet's status verbatim.
      function statusClass(status) {
        var s = String(status || "").toLowerCase();
        if (/under construction|construction started|topped out/.test(s)) return "is-building";
        if (/^completed|opened/.test(s)) return "is-done";
        return "is-upcoming";
      }
      function cap(s) { s = String(s || ""); return s.charAt(0).toUpperCase() + s.slice(1); }

      function factRow(label, value) {
        return value ? "<dt>" + label + "</dt><dd>" + esc(value) + "</dd>" : "";
      }

      function buildCards() {
        storyEl.innerHTML = "";
        FEATURES.forEach(function (f) {
          var p = f.properties;
          var el = document.createElement("article");
          el.className = "step" + (p.retail ? " is-retail" : "");
          el.dataset.n = p.n;
          el.setAttribute("role", "listitem");
          el.setAttribute("tabindex", "0");
          el.innerHTML =
            '<p class="kicker"><span class="dot">' + p.n + "</span>" +
              (p.retail ? "Retail tenant" : esc(cap(p.type))) + "</p>" +
            '<h3 class="proj">' + esc(p.name) + "</h3>" +
            '<span class="badge ' + statusClass(p.status) + '">' + esc(p.status) + "</span>" +
            '<p class="desc">' + esc(p.details) + "</p>" +
            '<dl class="facts">' +
              factRow(p.retail ? "Landlord / developer" : "Developer", p.owner) +
              factRow("Address", p.address) +
            "</dl>";
          el.addEventListener("click", function () { activate(p.n, true); });
          el.addEventListener("keydown", function (e) {
            if (e.key === "Enter" || e.key === " ") { e.preventDefault(); activate(p.n, true); }
          });
          storyEl.appendChild(el);
        });
      }

      function inCategory(p) {
        return category === "all" || (category === "retail") === !!p.retail;
      }

      // ---- Category filter (chips double as the legend) ----------------------
      function setCounts() {
        var r = FEATURES.filter(function (f) { return f.properties.retail; }).length;
        document.getElementById("countAll").textContent = FEATURES.length;
        document.getElementById("countDev").textContent = FEATURES.length - r;
        document.getElementById("countRetail").textContent = r;
      }
      function layerFilter() {
        if (category === "all") return null;
        return ["==", ["get", "retail"], category === "retail"];
      }
      function applyFilter() {
        Array.prototype.forEach.call(document.querySelectorAll("#filters .chip"), function (b) {
          b.setAttribute("aria-pressed", String(b.dataset.cat === category));
        });
        Array.prototype.forEach.call(storyEl.children, function (el) {
          var f = featureByN(+el.dataset.n);
          el.hidden = !(f && inCategory(f.properties));
        });
        if (mapApi && mapApi.map && mapApi.map.getLayer("points"))
          mapApi.map.setFilter("points", layerFilter());
        var cur = activeN != null && featureByN(activeN);
        if (!cur || !inCategory(cur.properties)) {
          var first = FEATURES.filter(function (f) { return inCategory(f.properties); })[0];
          if (first) activate(first.properties.n, false);
        }
        if (mapApi) {
          var shown = FEATURES.filter(function (f) { return inCategory(f.properties); });
          if (shown.length) mapApi.fitBounds(TRDMap.boundsOf({ type: "FeatureCollection", features: shown }), fitOpts());
        }
      }
      document.getElementById("filters").addEventListener("click", function (e) {
        var b = e.target.closest && e.target.closest(".chip");
        if (!b || b.dataset.cat === category) return;
        category = b.dataset.cat;
        applyFilter();
      });

      function featureByN(n) {
        for (var i = 0; i < FEATURES.length; i++)
          if (FEATURES[i].properties.n === n) return FEATURES[i];
        return null;
      }

      function setActiveSource(feature) {
        if (!mapApi || !mapApi.map) return;
        var src = mapApi.map.getSource("active");
        if (src) src.setData(feature ? { type: "FeatureCollection", features: [feature] } : EMPTY);
      }

      function activate(n, fromClick) {
        var f = featureByN(n);
        if (!f) return;
        activeN = n;
        Array.prototype.forEach.call(storyEl.children, function (el) {
          var on = String(el.dataset.n) === String(n);
          el.classList.toggle("active", on);
          if (on && fromClick) el.scrollIntoView({ behavior: prefersReduce() ? "auto" : "smooth", block: "nearest" });
        });
        if (mapApi && mapApi.map) {
          if (fromClick) mapApi.flyTo(f.geometry.coordinates, { zoom: 16.5 });
          setActiveSource(f);
        }
      }

      function prefersReduce() {
        return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      }
      function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }

      // ---- Overlap spreading ----------------------------------------------
      // Wynwood is dense: several projects sit within a pin's width of each
      // other (Hyatt Centric and Diesel are ~25 m apart; Casa Tua is inside
      // the NoMad building). For each zoom stop we project every pin to screen
      // pixels at that zoom, then relax overlapping pairs apart until they're
      // MIN_PX apart. The per-zoom offsets are interpolated by zoom and fade
      // to zero once the true positions stop colliding.
      var PIN_R = 12, MIN_PX = 2 * PIN_R + 3, TEXT_SIZE = 12;
      var ZOOMS = [13, 14, 15, 16, 17];
      function project(lon, lat, z) {
        var s = 512 * Math.pow(2, z), rad = lat * Math.PI / 180;
        return [(lon + 180) / 360 * s, (1 - Math.log(Math.tan(rad) + 1 / Math.cos(rad)) / Math.PI) / 2 * s];
      }
      function relax(features, z) {
        var base = features.map(function (f) { return project(f.geometry.coordinates[0], f.geometry.coordinates[1], z); });
        var pos = base.map(function (b) { return [b[0], b[1]]; });
        for (var it = 0; it < 200; it++) {
          var moved = false;
          for (var i = 0; i < pos.length; i++) {
            for (var j = i + 1; j < pos.length; j++) {
              var dx = pos[j][0] - pos[i][0], dy = pos[j][1] - pos[i][1];
              var d = Math.sqrt(dx * dx + dy * dy);
              if (d >= MIN_PX) continue;
              if (d < 0.01) { dx = 1; dy = 0; d = 1; }             // coincident: split east/west
              var push = (MIN_PX - d) / 2 + 0.05, ux = dx / d, uy = dy / d;
              pos[i][0] -= ux * push; pos[i][1] -= uy * push;
              pos[j][0] += ux * push; pos[j][1] += uy * push;
              moved = true;
            }
          }
          if (!moved) break;
        }
        return pos.map(function (p, k) { return [Math.round((p[0] - base[k][0]) * 10) / 10, Math.round((p[1] - base[k][1]) * 10) / 10]; });
      }
      function spreadOverlaps(features) {
        ZOOMS.forEach(function (z) {
          var offs = relax(features, z);
          features.forEach(function (f, k) {
            f.properties["o" + z] = offs[k];
            f.properties["t" + z] = [offs[k][0] / TEXT_SIZE, offs[k][1] / TEXT_SIZE];   // text-offset is in ems
          });
        });
      }
      function offsetExpr(prefix) {
        var e = ["interpolate", ["linear"], ["zoom"]];
        ZOOMS.forEach(function (z) { e.push(z, ["array", "number", 2, ["get", prefix + z]]); });
        e.push(18.5, ["literal", [0, 0]]);
        return e;
      }
      var ICON_OFF = offsetExpr("o"), TEXT_OFF = offsetExpr("t");

      // ---- Pin images (canvas-drawn, per theme, added per style.load) ---------
      function circleImage(r, fill, stroke, strokeW, alpha) {
        var s = 2, size = (r + strokeW) * 2 + 4;
        var cv = document.createElement("canvas");
        cv.width = cv.height = size * s;
        var g = cv.getContext("2d");
        g.scale(s, s);
        g.globalAlpha = alpha == null ? 1 : alpha;
        g.beginPath(); g.arc(size / 2, size / 2, r, 0, Math.PI * 2);
        if (fill) { g.fillStyle = fill; g.fill(); }
        if (stroke && strokeW) { g.lineWidth = strokeW; g.strokeStyle = stroke; g.stroke(); }
        return { img: g.getImageData(0, 0, cv.width, cv.height), pixelRatio: s };
      }
      function ensureImage(map, name, make) {
        if (map.hasImage(name)) return;
        var im = make();
        map.addImage(name, im.img, { pixelRatio: im.pixelRatio });
      }

      function addLayers(map, c) {
        var pal = COLORS[c.theme] || COLORS.light, t = c.theme;
        ["dev", "retail"].forEach(function (k) {
          ensureImage(map, "pin-" + k + "-" + t, function () { return circleImage(PIN_R, pal[k], "#ffffff", 2); });
          ensureImage(map, "glow-" + k + "-" + t, function () { return circleImage(28, pal[k], null, 0, 0.2); });
        });
        ensureImage(map, "ring-" + t, function () { return circleImage(PIN_R + 1, null, "#ffffff", 3.5); });
        function byCat(prefix) { return ["case", ["get", "retail"], prefix + "retail-" + t, prefix + "dev-" + t]; }

        if (!map.getSource("devs")) map.addSource("devs", { type: "geojson", data: c.data });
        if (!map.getSource("active")) map.addSource("active", { type: "geojson", data: EMPTY });

        if (!map.getLayer("active-glow"))
          map.addLayer({ id: "active-glow", type: "symbol", source: "active",
            layout: { "icon-image": byCat("glow-"), "icon-offset": ICON_OFF, "icon-allow-overlap": true, "icon-ignore-placement": true } });
        if (!map.getLayer("points")) {
          var pointsLayer = { id: "points", type: "symbol", source: "devs",
            layout: {
              "icon-image": byCat("pin-"), "icon-offset": ICON_OFF, "icon-allow-overlap": true, "icon-ignore-placement": true,
              "symbol-sort-key": ["-", 0, ["get", "n"]],
              "text-field": ["to-string", ["get", "n"]], "text-font": ["Open Sans Bold", "Arial Unicode MS Bold"],
              "text-size": TEXT_SIZE, "text-offset": TEXT_OFF, "text-allow-overlap": true, "text-ignore-placement": true,
            },
            paint: { "text-color": "#ffffff" } };
          if (layerFilter()) pointsLayer.filter = layerFilter();   // survives theme swaps
          map.addLayer(pointsLayer);
        }
        if (!map.getLayer("active-ring"))
          map.addLayer({ id: "active-ring", type: "symbol", source: "active",
            layout: { "icon-image": "ring-" + t, "icon-offset": ICON_OFF, "icon-allow-overlap": true, "icon-ignore-placement": true } });
      }

      var isEmbedCtx = false;
      function fitOpts() {
        return { padding: isEmbedCtx ? 60 : (window.innerWidth < 700 ? 40 : 70), maxZoom: 16 };
      }

      var controller = TRDEmbed({
        prefix: "wynwood-map-09-25-26",
        themeKey: "wynwood-map-09-25-26:theme",
        toggle: "#themeToggle",
        mountTarget: "#map",
        onMount: function (ctx) {
          isEmbedCtx = ctx.isEmbed;
          TRDMap.loadGeoJSON("data.geojson").then(function (GEO) {
            FEATURES = GEO.features.slice().sort(function (a, b) { return a.properties.n - b.properties.n; });
            spreadOverlaps(FEATURES);
            setCounts();
            buildCards();

            mapApi = TRDMap.create({
              container: "map",
              token: TOKEN,
              theme: ctx.theme,
              embed: ctx.isEmbed,
              data: GEO,
              bounds: TRDMap.boundsOf(GEO),
              fitBoundsOptions: fitOpts(),
              overlayWidth: 400,
              cooperativeGestures: ctx.isEmbed,
              interactiveLayers: ["points"],
              addLayers: addLayers,
              onFeatureClick: function (feature) {
                if (feature && feature.properties) activate(feature.properties.n, true);
              },
            });

            mapApi.on("style", function () {
              if (activeN != null) setActiveSource(featureByN(activeN));
            });
            mapApi.on("loaded", function () {
              activate(FEATURES[0].properties.n, false);
              ctx.postLoaded();
            });
          }).catch(function (e) {
            console.error("Could not load data.geojson", e);
            storyEl.innerHTML = '<div class="step">Data failed to load.</div>';
          });
        },
        onTheme: function (theme, ctx) {
          if (mapApi) mapApi.setTheme(theme);
          ctx.requestResize();
        },
      });
    </script>
  </body>
</html>

    <main class="map-container">
      <section id="map" class="map"></section>
      <section id="modal" class="detail-modal modal">
        <div class="modal-dialog modal-dialog-scrollable">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title"></h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body"></div>
          </div>
        </div>
      </section>
    </main>

    <script src="https://experience.tinypass.com/xbuilder/experience/load?aid=p7sVIGTDn5"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.5.1/mapbox-gl.js"></script>
    <script src="https://static.therealdeal.com/library/theme.js?v=1.0"></script>
    <script src="../trd-data/common-formatter/formatter.js"></script>
    <script src="../trd-data/common-loading/loading.js"></script>
    <script src="../trd-data/common-map/map.js?v=1.1"></script>
    <script>
      const tooltipDisplayFields = {
        title: {
          field: "location_address",
          label: "Address",
        },
        content: [
          {
            field: "start_date",
            label: "Start Date",
            format: "formatDate",
          },
          {
            field: "status",
            label: "Status",
          },
          {
            field: "type_of_work",
            label: "Type of Work",
          },
        ],
      };

      const legendKeys = [
        {
          title: "Type of Work",
          options: [
            {
              value: "New Construction",
              text: "New Construction",
              default: false,
              color: {
                light: "#35cd7d",
                dark: "#35cd7d",
              },
            },
            {
              value: "Renovation/Alteration",
              text: "Renovation",
              default: false,
              color: {
                light: "#3467cd",
                dark: "#3467cd",
              },
            },
            {
              value: "Additions to Existing Building",
              text: "Additions",
              default: false,
              color: {
                light: "#BF360C",
                dark: "#BF360C",
              },
            },
            {
              text: "Other",
              value: "",
              default: true,
              color: {
                light: "#000000",
                dark: "#ffffff",
              },
            },
          ],
        },
      ];

      const modalDisplayFields = {
        title: {
          field: "location_address",
          label: "Address",
        },
        content: [
          { field: "project_number", label: "Project number" },
          { field: "project_name", label: "Project name" },
          { field: "status", label: "status" },
          // { field: "current_status", label: "Current Status" },
          { field: "city", label: "City" },
          { field: "county", label: "County" },
          { field: "work_type", label: "Work Type" },
          { field: "cost", label: "Cost", format: "formatCurrency" },
          { field: "square_footage", label: "Square Footage" },
          // { field: "estimated_cost", label: "Estimated Cost" },
          { field: "facility_name", label: "Facility name" },
          // { field: "detail_project_name", label: "Detail Project Name" },
          // { field: "detail_project_number", label: "Detail Project Number" },
          // { field: "detail_facility_name", label: "Detail Facility Name" },
          {
            field: "start_date",
            label: "Start Date",
            format: "formatDate",
          },
          {
            field: "completion_date",
            label: "Completion Date",
            format: "formatDate",
          },
          { field: "type_of_work", label: "Type of Work" },
          { field: "type_of_funds", label: "Type of Funds" },
          { field: "scope_of_work", label: "Scope of Work" },
          {
            field: "private_funds_provided_by_tenant",
            label: "Private Funds Provided by Tenant",
          },
          { field: "true_owner", label: "True Owner" },
          { field: "owner_name", label: "Owner Name" },
          { field: "owner_address", label: "Owner Address" },
          { field: "owner_phone", label: "Owner Phone" },
          { field: "contact_name", label: "Contact Name" },
          { field: "tenant_name", label: "Tenant Name" },
          { field: "tenant_phone", label: "Tenant Phone" },
          { field: "design_firm_name", label: "Design Firm Name" },
          { field: "design_firm_address", label: "Design Firm Address" },
          { field: "design_firm_phone", label: "Design Firm Phone" },
          {
            field: "detail_url",
            label: "Detail URL",
            format: (value) => `<a href="${value}" target="_blank">View</a>`,
          },
        ],
      };

      const filterFields = [
        {
          title: "Status",
          name: "status",
          dataField: "status",
          fieldType: "checkbox",
          fieldLayoutClass: "checkbox-group",
          multiSelect: true,
          callback: (values, item) => {
            return values.some((value) => {
              if (value === "" || value.length === 0) {
                return item.properties["status"] === "";
              }

              const group = value.split("|");
              for (const v of group) {
                if (item.properties["status"].includes(v)) {
                  return true;
                }
              }
            });
          },
          options: [
            {
              label: "Registered",
              value: "Project Registered",
            },
            {
              label: "Complete",
              value: "Review Complete",
            },
          ],
        },
        {
          title: "County",
          name: "county",
          dataField: "county",
          fieldType: "checkbox",
          fieldLayoutClass: "checkbox-group",
          multiSelect: true,
          callback: (values, item) => {
            return values.some((value) => {
              if (value === "" || value.length === 0) {
                return item.properties["county"] === "";
              }

              const group = value.split("|");
              for (const v of group) {
                if (item.properties["county"].includes(v)) {
                  return true;
                }
              }
            });
          },
          options: [
            {
              label: "Travis",
              value: "Travis",
            },
            {
              label: "Harris",
              value: "Harris",
            },
            {
              label: "Dallas",
              value: "Dallas",
            },
            {
              label: "Bexar",
              value: "Bexar",
            },
          ],
        },
        {
          title: "Type of Work",
          name: "type_of_work",
          dataField: "type_of_work",
          fieldType: "checkbox",
          fieldLayoutClass: "checkbox-group",
          multiSelect: true,
          callback: (values, item) => {
            return values.some((value) => {
              if (value === "" || value.length === 0) {
                return item.properties["type_of_work"] === "";
              }

              const group = value.split("|");
              for (const v of group) {
                if (item.properties["type_of_work"].includes(v)) {
                  return true;
                }
              }
            });
          },
          options: [
            {
              label: "Additions",
              value: "Additions",
            },
            {
              label: "New Construction",
              value: "New Construction",
            },
            {
              label: "Renovation/Alteration",
              value: "Renovation/Alteration",
            },
          ],
        },
        {
          title: "Type of Funds",
          name: "type_of_funds",
          dataField: "type_of_funds",
          fieldType: "checkbox",
          fieldLayoutClass: "checkbox-group",
          multiSelect: true,
          callback: (values, item) => {
            return values.some((value) => {
              if (value === "" || value.length === 0) {
                return item.properties["type_of_funds"] === "";
              }

              const group = value.split("|");
              for (const v of group) {
                if (item.properties["type_of_funds"].includes(v)) {
                  return true;
                }
              }
            });
          },
          options: [
            {
              label: "Private",
              value: "private",
            },
            {
              label: "Public",
              value: "public",
            },
          ],
        },
      ];
      window.map = trdDataCommonMap({
        filePaths: [
          "https://static.therealdeal.com/interactive-maps/texas-tdlr-construction-projects.geojson",
        ],
        eventCategory: "texas-permits-map",
        mapElementId: "map",
        filterElementId: "map-filters",
        legendElementId: "legend",
        resultElementId: "result",
        mapCenterLat: 31.415735239556028,
        mapCenterLng: -99.49922274877605,
        zoom: 6,
        minZoom: 5.5,
        tooltipDisplayFields,
        modalDisplayFields,
        legendKeys,
        dataPointKeys: legendKeys[0].options,
        loadingEnabled: true,
        filterFields,
        // World polygon with Texas punched out, so everything outside the state is dimmed.
        shapeSettings: {
          enable: true,
          idPrefix: "texas-mask",
          filePaths: ["texas-state-mask.geojson"],
          paintSettings: {
            fillOpacity: 0.55,
            fillColor: {
              light: "#999999",
              dark: "#222222",
            },
            outlineColor: {
              light: "rgba(0, 0, 0, 0)",
              dark: "rgba(0, 0, 0, 0)",
            },
          },
        },
        pointSettings: {
          clickToCenter: true,
          clickToZoom: true,
          colorType: "case",
          radiusType: "ratio",
          colorTypeDataKey: "type_of_work",
          paintSettings: {
            hover: {
              color: { light: "#FF9800", dark: "#F57C00" },
            },
            active: {
              color: { light: "#FF5722", dark: "#D84315" },
            },
          },
        },
        searchSettings: {
          enable: true,
          placeholderText: "Search by Address or Town...",
          resultTitleField: "location_address",
          searchFields: [
            "location_address",
            "project_name",
            "project_number",
            "county",
            "ras_name",
            "ras_number",
            "owner_name",
            "contact_name",
            "tenant_name",
            "design_firm_name",
            "type_of_funds",
            "scope_of_work",
            "type_of_work",
          ],
        },
      });

      // Re-added on every style.load because switching themes clears custom sources/layers.
      window.map.on("style.load", () => {
        if (!window.map.getSource("texas-state")) {
          window.map.addSource("texas-state", {
            type: "geojson",
            data: "texas-state.geojson",
          });
        }

        if (!window.map.getLayer("texas-state-outline")) {
          window.map.addLayer({
            id: "texas-state-outline",
            type: "line",
            source: "texas-state",
            paint: {
              "line-color": trdTheme.isDark() ? "#FF9800" : "#FF5722",
              "line-width": 1,
            },
          });
        }
      });

      // The dimming mask is added asynchronously once data loads, so keep the border above it.
      window.map.on("idle", () => {
        if (
          window.map.getLayer("texas-mask-layer-0") &&
          window.map.getLayer("texas-state-outline")
        ) {
          window.map.moveLayer("texas-state-outline");
        }
      });
    </script>
  </body>
</html>

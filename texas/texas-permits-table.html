    <script src="https://experience.tinypass.com/xbuilder/experience/load?aid=p7sVIGTDn5"></script>

    <script src="../trd-data/common-formatter/formatter.js"></script>
    <script src="../trd-data/common-table/table.js"></script>
    <script type="text/javascript">
      const displayColumns = [
        { dataField: "work_type", name: "Work Type", visible: true },
        { dataField: "project_number", name: "Project Number", visible: false },
        { dataField: "project_name", name: "Project Name", visible: true },
        { dataField: "status", name: "Status", visible: true },
        { dataField: "city", name: "City", visible: true },
        { dataField: "county", name: "County", visible: true },
        {
          dataField: "cost",
          name: "Cost",
          visible: true,
          formatter: TrdFormatters.formatCurrency,
        },
        { dataField: "square_footage", name: "Square Footage", visible: true },
        { dataField: "facility_name", name: "Facility Name", visible: true },
        {
          dataField: "start_date",
          name: "Start Date",
          visible: true,
          sorter: (a, b) => {
            if (
              TrdFormatters.isEmptyValue(a) ||
              TrdFormatters.isEmptyValue(b)
            ) {
              return 0;
            }
            return new Date(a).getTime() - new Date(b).getTime();
          },
        },
        {
          dataField: "completion_date",
          name: "Completion Date",
          visible: true,
          sorter: (a, b) => {
            if (
              TrdFormatters.isEmptyValue(a) ||
              TrdFormatters.isEmptyValue(b)
            ) {
              return 0;
            }
            return new Date(a).getTime() - new Date(b).getTime();
          },
        },
        { dataField: "type_of_funds", name: "Type of Funds" },
        {
          dataField: "scope_of_work",
          name: "Scope of Work",
        },
        {
          dataField: "private_funds_provided_by_tenant",
          name: "Private Funds Provided by Tenant",
        },
        {
          dataField: "ras_name",
          name: "RAS Name",
          visible: false,
        },
        {
          dataField: "detail_url",
          name: "Detail URL",
          visible: true,
          formatter: (value) => {
            return `<a href="${value}" target="_blank" rel="noopener noreferrer">View Detail</a>`;
          },
        },
        { dataField: "ras_number", name: "RAS Number" },
        { dataField: "ras_address", name: "RAS Address" },
        { dataField: "ras_phone", name: "RAS Phone" },
        { dataField: "true_owner", name: "True Owner" },
        { dataField: "owner_name", name: "Owner Name" },
        { dataField: "owner_address", name: "Owner Address" },
        { dataField: "owner_phone", name: "Owner Phone" },
        { dataField: "contact_name", name: "Contact Name" },
        { dataField: "tenant_name", name: "Tenant Name" },
        { dataField: "tenant_phone", name: "Tenant Phone" },
        {
          dataField: "design_firm_name",
          name: "Design Firm Name",
        },
        {
          dataField: "design_firm_address",
          name: "Design Firm Address",
        },
        {
          dataField: "design_firm_phone",
          name: "Design Firm Phone",
        },
      ];

      const fetchDataFilterCallback = (data) => {
        return data.features.map((item) => {
          return {
            ...item.properties,
          };
        });
      };

      TrdDataCommonTable({
        filePath:
          "https://static.therealdeal.com/interactive-maps/texas-tdlr-construction-projects.geojson",
        eventCategory: "texas-permits-table",
        displayColumns,
        fetchDataFilterCallback,
        loadingEnabled: true,
        tableConfig: {
          sortName: TrdFormatters.getFieldName("completion_date"),
        },
      });
    </script>
  </body>

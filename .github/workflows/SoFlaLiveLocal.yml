name: SoFla LiveLocal Update

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 5 * * *'  # 12:00 AM ET in winter, 1:00 AM ET in summer

permissions:
  contents: write

jobs:
  update-SoFla-LiveLocal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

        # @see https://github.com/marketplace/actions/setup-python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ./south-florida/_live_local_auto_update/requirements.txt

      - name: Run jupyter notebook
        working-directory: ./south-florida/_live_local_auto_update
        run: |
          # Decode the base64 encoded credentials and save to a file
          # @see
          echo "${{ secrets.AUTO_SCRAPER_CREDENTIALS_BASE64 }}" | base64 --decode > autoscraper-380600-0d0c84856d6b.json
          jupyter execute LiveLocalAutoUpdater.ipynb --ExecutePreprocessor.timeout=-1

      - name: Commit and push changes
        run: |
          git config --local user.name "GitHub Actions"
          git config --local user.email "actions@github.com"
          # The live map and table read south-florida/south-florida-live-local.geojson
          mv ./south-florida/_live_local_auto_update/live_local.geojson ./south-florida/south-florida-live-local.geojson
          git add ./south-florida/south-florida-live-local.geojson
          git commit -m "Update SoFla Live Local Map data" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Clean up
        if: always()
        run: |
          rm -f ./south-florida/_live_local_auto_update/autoscraper-380600-0d0c84856d6b.json
